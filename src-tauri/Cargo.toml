[package]
name = "noctyrium"
version = "0.1.0-alpha.1"
description = "Noctyrium desktop shell"
authors = ["Noctyrium"]
license = "UNLICENSED"
repository = "https://github.com/jaclose/Noctyrium"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "noctyrium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native JavaScript dialogs (src/webview_dialogs.rs). Already in the tree via wry.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSString"] }
